# log_level = "info"

[tailscale]
hostname = "waypoint-db"
state_dir = "/var/lib/waypoint/tsnet"
# Auth key (or set TS_AUTHKEY env var):
# auth_key = "${TS_AUTHKEY}"
# control_url = "https://controlplane.tailscale.com"
# ephemeral = false
# advertise_tags = ["tag:waypoint"]
#
# OAuth client credentials (requires advertise_tags):
# client_secret = "${TS_CLIENT_SECRET}"
# advertise_tags = ["tag:waypoint"]
#
# Workload Identity Federation (requires client_id + advertise_tags):
# client_id = "your-client-id"
# id_token = "${WIF_ID_TOKEN}"
# audience = "https://login.tailscale.com"
# advertise_tags = ["tag:waypoint"]

[provisioning]
# allow_raw_sql = true   # set to false to disable raw SQL in ACL grants (presets only)

[redis]
address = "localhost:6379"
# password = ""
# db = 0
key_prefix = "waypoint:"
# service_name = "redis"   # peer.service for OTel traces (default: "redis")

[revalidation]
interval = "1m"

[defaults.limits]
max_conns_total = 200

# [metrics]
# endpoint = "http://localhost:4318"   # OTLP endpoint (enables metrics when set)
# protocol = "http"                     # "http" (default) or "grpc"
# interval = "30s"                      # export interval
# temporality = "delta"                 # "delta" (default, recommended for Datadog) or "cumulative"
# tracing_sample_rate = 0.0            # 0 = disabled, 1.0 = trace all requests
#
# [metrics.enable]
# # Each key is a metric name — presence enables it. Value is the tag allow-list.
# # Use ["*"] for all tags, [] for no tags.
# "waypoint.conn.active"      = ["listener", "mode", "backend"]
# "waypoint.conn.total"       = ["listener", "mode"]
# "waypoint.conn.duration"    = ["listener", "user", "backend"]
# "waypoint.conn.rejected"    = ["listener", "mode"]
# "waypoint.handshake.aborted" = ["listener", "mode"]  # benign client disconnects during handshake
# "waypoint.auth.attempts"    = ["listener"]
# "waypoint.auth.failures"    = ["listener"]
# "waypoint.auth.latency"     = ["listener", "backend"]
# "waypoint.reval.attempts"   = ["listener"]
# "waypoint.reval.failures"   = ["listener"]
# "waypoint.bytes.read"       = ["listener", "user"]
# "waypoint.bytes.written"    = ["listener", "user"]
# "waypoint.limit.violations" = ["listener", "limit_type"]
# "waypoint.provision.total"  = ["listener"]
# "waypoint.provision.latency" = ["listener"]
# "waypoint.provision.errors" = ["listener"]
# "waypoint.cleanup.runs"     = []
# "waypoint.cleanup.dropped"  = []
# "waypoint.redis.op_duration" = ["operation"]
# "waypoint.redis.errors"     = ["operation"]
# "waypoint.system.listeners" = []
# "waypoint.querylog.emitted" = ["listener"]
# "waypoint.querylog.dropped" = ["listener"]  # records lost because the log queue was full
# "waypoint.querylog.parse_errors" = ["listener"]  # statements the parser rejected — these log raw text

[[listeners]]
name = "pg-main"
listen = ":5432"
mode = "postgres"
backend = "10.0.1.10:5432"
tls_mode = "optional"                   # off | optional | require
use_tailscale_tls = true                # set false to use only cert_file/key_file
# cert_file = "/etc/waypoint/server.crt" # optional custom-domain cert
# key_file = "/etc/waypoint/server.key"

[listeners.postgres]
admin_user = "waypoint_admin"
admin_password = "${PG_ADMIN_PASSWORD}"
admin_database = "postgres"
user_prefix = "wp_"
user_ttl = "24h"
# service_name = "my-prod-db"   # peer.service override for OTel (default: listener name)

# Per-statement audit logging. Off by default; postgres and mongodb modes only.
# [listeners.query_log]
# level = "metadata"                    # off (default) | metadata | normalized | full
#                                       #   metadata   — verb, tables, rows, duration; no statement text
#                                       #   normalized — statement with constants elided
#                                       #   full       — verbatim statement and bind parameters
# max_level = "full"                    # ceiling an ACL grant may raise to (default: same as level)
# max_statement_bytes = 4096            # statement truncation limit (default: 4096)
#
# Note: a statement the parser rejects is logged verbatim at every level,
# including "metadata". Watch waypoint.querylog.parse_errors for how often
# that happens.

[[listeners]]
name = "raw-mysql"
listen = ":3306"
mode = "tcp"
backend = "10.0.1.5:3306"

# Example: MongoDB replica set reachable only from Waypoint over Tailscale.
# Clients connect to waypoint-db:27017, waypoint-db:27018, and waypoint-db:27019;
# Waypoint rewrites MongoDB topology responses so drivers never connect directly
# to the production member addresses.
# [[listeners]]
# name = "mongo-prod"
# listen = ":27017"          # first listener port when using mongodb.srv
# mode = "mongodb"
# backend_via_tailscale = true
# tls = true                # optional: use TLS to MongoDB backends
# tls_mode = "require"      # off | optional | require for clients
# use_tailscale_tls = true  # set false to use only cert_file/key_file
# cert_file = "/etc/waypoint/mongo.crt" # optional custom-domain cert
# key_file = "/etc/waypoint/mongo.key"
# advertise = "waypoint-db:27017" # optional host override; member ports are preserved
#
# [listeners.mongodb]
# admin_user = "waypoint_admin"
# admin_password = "${MONGO_ADMIN_PASSWORD}"
# auth_database = "admin"
# user_prefix = "wp_"
# user_ttl = "24h"
# replica_set = "rs0"
# srv = "cluster.example.com" # resolves _mongodb._tcp.cluster.example.com
# srv_max_members = 3         # binds :27017, :27018, and :27019
#
# [listeners.mongodb.provision]
# mode = "database" # default: create/update scoped MongoDB users
#
# For Atlas or clusters where MongoDB user-management commands are unavailable,
# use pre-created static backend users instead:
# [listeners.mongodb.provision]
# mode = "static"
#
# [[listeners.mongodb.provision.static_users]]
# name = "app-readwrite"
# username = "atlas_app_rw"
# password = "${MONGO_APP_RW_PASSWORD}"
# auth_database = "admin"
# database = "app"
# permissions = ["readwrite"]
#
# [[listeners.mongodb.provision.static_users]]
# name = "readonly"
# username = "atlas_readonly"
# password = "${MONGO_READONLY_PASSWORD}"
# auth_database = "admin"
# permissions = ["readonly"]
#
# Or omit srv/srv_max_members and configure explicit members:
# [[listeners.mongodb.members]]
# backend = "mongo1.prod.internal:27017"
# listen = ":27017"
# advertise = "waypoint-db:27017"
#
# [[listeners.mongodb.members]]
# backend = "mongo2.prod.internal:27017"
# listen = ":27018"
# advertise = "waypoint-db:27018"
#
# [[listeners.mongodb.members]]
# backend = "mongo3.prod.internal:27017"
# listen = ":27019"
# advertise = "waypoint-db:27019"

# Sharded cluster: set topology = "sharded" and list the mongos routers as
# members (one Waypoint listener per mongos). A mongos advertises no replica-set
# topology, so no address rewriting is needed; the provisioner connects through
# the mongos so dynamic users propagate to the config servers and all shards.
# topology is mutually exclusive with replica_set.
#
# With multiple mongos routers, a user provisioned via one mongos may take up to
# userCacheInvalidationIntervalSecs (default 30s) to become authable on the
# others; lower that mongos parameter if clients spread across routers.
# [listeners.mongodb]
# admin_user = "waypoint_admin"
# admin_password = "${MONGO_ADMIN_PASSWORD}"
# auth_database = "admin"
# topology = "sharded"
#
# [[listeners.mongodb.members]] # a mongos router
# backend = "mongos1.prod.internal:27017"
# listen = ":27017"
# advertise = "waypoint-db:27017"
#
# [[listeners.mongodb.members]] # another mongos router
# backend = "mongos2.prod.internal:27017"
# listen = ":27018"
# advertise = "waypoint-db:27018"

# Example: backend reachable only via Tailscale (MagicDNS name or 100.x.y.z IP).
# [[listeners]]
# name = "ts-backend"
# listen = ":6379"
# mode = "tcp"
# backend = "my-redis.tail-scale.ts.net:6379"
# backend_via_tailscale = true

# Example: register as a Tailscale Service (requires tagged node + ACL auto-approval).
# [[listeners]]
# name = "pg-service"
# listen = ":5432"
# mode = "postgres"
# backend = "10.0.1.10:5432"
# tls_mode = "require"
# service = "svc:waypoint-db"

# --- Web console -------------------------------------------------------------
# A browser-facing SQL console. It reuses the same identity path as the wire
# protocol modes — Tailscale WhoIs plus capability grants — so there is no
# login page, no session cookie, and no password to manage.
#
# The console is stateless. Every request is authorized on its own, so a
# revoked grant takes effect on the next request rather than at the next
# revalidation tick. Nothing the user does is preserved: closing the browser
# discards the tabs, the buffers, and the results.
[[listeners]]
name = "console"
listen = ":8443"
mode = "web"
backend = "10.0.1.10:5432"
tls_mode = "require"       # web listeners are https unless set to "off"
use_tailscale_tls = true   # serve https with the node's *.ts.net certificate

# Admin credentials, used exactly as postgres mode uses them: to provision a
# per-user role. The console connects as that role, so Postgres — not the UI —
# enforces what the user may read and write.
[listeners.postgres]
admin_user = "waypoint_admin"
admin_password = "${PG_ADMIN_PASSWORD}"
admin_database = "postgres"
user_prefix = "wp_"
user_ttl = "24h"

[listeners.web]
# The picker's menu. Provisioning grants in each of these, so they need not
# include admin_database; capability grants still decide who reaches what.
databases = ["appdb", "analytics"]
max_rows = 1000                      # hard cap on rows returned to the browser
statement_timeout = "30s"            # bounds a single statement server-side
max_pool_conns = 4                   # pooled connections per (user, database)
idle_pool_timeout = "10m"            # pools are a cache, never session state

# Queries run in the browser land in the same audit stream as those run
# through psql.
[listeners.query_log]
level = "metadata"
max_level = "normalized"
